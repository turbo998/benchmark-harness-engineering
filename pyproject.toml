[build-system]
requires = ["hatchling==1.32.4", "editables==0.6"]
build-backend = "hatchling.build"

[project]
name = "benchmark-harness-engineering"
version = "0.1.0"
description = "Evidence-first, offline-default API and coding evaluation harness"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic==2.14.1",
  "typer==0.27.3",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
azure = [
  "azure-identity==1.26.0",
  "azure-storage-blob==12.31.0",
  "cryptography==46.0.3",
]

[project.scripts]
benchmark-harness = "benchmark_harness.cli:app"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.0",
  "mypy==2.4.0",
  "jsonschema==4.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/benchmark_harness"]

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true
